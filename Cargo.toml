[package]
name = "trueclip"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "A lightweight desktop text clipboard history"
publish = false

[dependencies]
arboard = { version = "3.6.1", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
directories = "6.0.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
slint = { version = "~1.18.1", default-features = false, features = [
    "std",
    "compat-1-18",
    "backend-winit",
    "renderer-software",
    "accessibility",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
slint-build = "~1.18.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
